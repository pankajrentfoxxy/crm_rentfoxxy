name: CI/CD Deploy to VPS

# Dual-branch / dual-server deploy:
#   support_revamp     → staging    (157.173.221.119)  /var/www/crm_rentfoxxy_staging
#   new_crm_rentfoxxy  → production (187.77.187.213)   /var/www/crm_rentfoxxy
#
# Manual Run workflow can still target staging / production / both.
#
# Secrets live on GitHub Environments `staging` and `production`
# (each has its own VPS_HOST / VPS_USER / VPS_SSH_KEY).

on:
  push:
    branches:
      - support_revamp
      - new_crm_rentfoxxy
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        type: choice
        options:
          - staging
          - production
          - both
        default: staging

concurrency:
  group: deploy-crm-rentfoxxy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging (support_revamp → 157)
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/support_revamp') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.target == 'staging' || github.event.inputs.target == 'both'))
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to staging VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          echo "Deploying staging (support_revamp) → ${VPS_USER}@${VPS_HOST}"
          ssh -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" << 'EOF'
          set -euo pipefail

          cd /var/www/crm_rentfoxxy_staging

          git fetch origin
          if git show-ref --verify --quiet refs/heads/support_revamp; then
            git checkout support_revamp
          else
            git checkout -b support_revamp origin/support_revamp
          fi
          git pull origin support_revamp
          git reset --hard origin/support_revamp

          echo "Active branch: $(git branch --show-current)"
          echo "HEAD: $(git rev-parse --short HEAD)"

          cd backend
          npm install

          cd ../frontend
          npm install
          npm run build

          cd ../customer-portal
          npm install
          npm run build

          cd ../vendor-portal
          npm install
          npm run build

          pm2 restart 5
          pm2 save

          echo "Staging deploy finished (support_revamp)"
          EOF

  deploy-production:
    name: Deploy production (new_crm_rentfoxxy → 187)
    # Push to new_crm_rentfoxxy → production only.
    # Manual "both" → after staging succeeds; manual "production" → staging skipped OK.
    if: >
      always() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/new_crm_rentfoxxy') ||
        (github.event_name == 'workflow_dispatch' &&
         (github.event.inputs.target == 'production' || github.event.inputs.target == 'both'))
      ) &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to production VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          echo "Deploying production (new_crm_rentfoxxy) → ${VPS_USER}@${VPS_HOST}"
          ssh -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" << 'EOF'
          set -euo pipefail

          cd /var/www/crm_rentfoxxy

          git fetch origin
          if git show-ref --verify --quiet refs/heads/new_crm_rentfoxxy; then
            git checkout new_crm_rentfoxxy
          else
            git checkout -b new_crm_rentfoxxy origin/new_crm_rentfoxxy
          fi
          git pull origin new_crm_rentfoxxy
          git reset --hard origin/new_crm_rentfoxxy

          echo "Active branch: $(git branch --show-current)"
          echo "HEAD: $(git rev-parse --short HEAD)"

          cd backend
          npm install

          cd ../frontend
          npm install
          npm run build

          cd ../customer-portal
          npm install
          npm run build

          cd ../vendor-portal
          npm install
          npm run build

          pm2 restart crm-backend
          pm2 save

          echo "Production deploy finished (new_crm_rentfoxxy)"
          EOF
