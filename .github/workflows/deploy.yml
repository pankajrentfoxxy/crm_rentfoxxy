name: CI/CD Deploy to VPS

# Single pipeline: deploy on push to the active branch only.
# No pull_request triggers — avoids duplicate runs on open PRs.
on:
  push:
    branches:
      - new_crm_rentfoxxy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} << 'EOF'

          set -e

          cd /var/www/crm_rentfoxxy

          git fetch origin
          git reset --hard origin/new_crm_rentfoxxy

          cd backend
          npm install

          cd ../frontend
          npm install
          npm run build

          cd ../customer-portal
          npm install
          npm run build

          cd ../vendor-portal
          npm install
          npm run build

          pm2 restart crm-backend
          pm2 save

          EOF
