name: Deploy to VPS

on:
push:
branches:
- new_crm_rentfoxxy

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Configure SSH
    uses: webfactory/ssh-agent@v0.9.0
    with:
      ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

  - name: Deploy
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    run: |
      ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} << 'EOF'

      set -e

      cd /var/www/crm_rentfoxxy

      git fetch origin
      git reset --hard origin/new_crm_rentfoxxy

      # Backend
      cd backend
      npm install

      # Frontend
      cd ../frontend
      npm install
      npm run build

      # Customer Portal
      cd ../customer-portal
      npm install
      npm run build

      # Vendor Portal
      cd ../vendor-portal
      npm install
      npm run build

      # Restart Backend
      pm2 restart crm-backend
      pm2 save

      EOF
```
