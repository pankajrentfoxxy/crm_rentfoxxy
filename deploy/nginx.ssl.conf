# Full HTTPS config when SSL certs exist at /etc/letsencrypt/live/crm.rentfoxxy.com/

# HTTP - ACME + redirect to HTTPS
server {
    listen 80;
    server_name crm.rentfoxxy.com 187.77.187.213 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - CRM
server {
    listen 443 ssl http2;
    server_name crm.rentfoxxy.com 187.77.187.213 _;

    ssl_certificate /etc/letsencrypt/live/crm.rentfoxxy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.rentfoxxy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 4k;
    }

    client_max_body_size 20M;
}
